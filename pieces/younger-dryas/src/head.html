<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  THE YOUNGER DRYAS — 9:16 Vertical, 50.0s @ 96 BPM, 24fps.
//  A cut-paper animated investigation into the cosmic impact
//  and sudden 1,200-year deep freeze that reshaped humanity:
//  0. Intro Title Card (0.0 - 7.2s)
//  1. The Comet Airburst (7.2 - 14.4s)
//  2. The Black Mat Layer & Megafauna (14.4 - 21.6s)
//  3. The Megafloods & Shutdown (21.6 - 28.8s)
//  4. The 1,200-Year Deep Freeze (28.8 - 36.0s)
//  5. The Thaw & Göbekli Tepe (36.0 - 43.2s)
//  6. Epilogue: The Dawn of Civilization (43.2 - 50.0s)
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 96, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 50.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const PRINTF = '"Arial Black", "Helvetica Neue", "Franklin Gothic Heavy", Impact, sans-serif';
const HAND = '"Ink Free", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive';
const SERIF = 'Georgia, "Times New Roman", serif';
const CX = 540, CY = 960;

const ERA_LIST = [
  [0.0,   7.2,  () => sceneIntro()],
  [7.2,  14.4,  () => sceneImpact()],
  [14.4, 21.6,  () => sceneBlackMat()],
  [21.6, 28.8,  () => sceneMegaflood()],
  [28.8, 36.0,  () => sceneFreeze()],
  [36.0, 43.2,  () => sceneGobekli()],
  [43.2, 50.0,  () => sceneOutro()]
];

const SHOTS = [
  ['intro',     0,  0.0,  7.2, 'The Younger Dryas: Earth on the Brink (12,800 BP)'],
  ['impact',    1,  7.2, 14.4, 'Cosmic Airburst: Comet Explosion over Ice Sheet'],
  ['blackmat',  2, 14.4, 21.6, 'The Black Mat: Soot, Nanodiamonds & Megafauna Extinction'],
  ['megaflood', 3, 21.6, 28.8, 'The Great Meltwater Pulse: Lake Agassiz Ocean Breach'],
  ['freeze',    4, 28.8, 36.0, 'The 1,200-Year Deep Freeze: Glacial Survival'],
  ['gobekli',   5, 36.0, 43.2, 'Göbekli Tepe: Pillar 43 & The Comet Memory in Stone'],
  ['outro',     6, 43.2, 50.0, 'Out of Cataclysm: The Dawn of Agriculture & Civilization']
];

const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  gpu: true,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [7.2, 14.4, 21.6, 28.8, 36.0, 43.2],
  cues: {
    earthGlobe: 3.6,
    cometFlash: 10.8,
    mammothBone: 18.0,
    waterRush: 25.2,
    iceCampfire: 32.4,
    pillarVulture: 39.6,
    starDisk: 46.8
  },
  acts: [
    { name: 'Prologue',   role: 'thaw',       t0:  0.0, t1:  7.2 },
    { name: 'Impact',     role: 'detonation', t0:  7.2, t1: 14.4 },
    { name: 'Extinction', role: 'boundary',   t0: 14.4, t1: 21.6 },
    { name: 'Flood',      role: 'deluge',     t0: 21.6, t1: 28.8 },
    { name: 'Freeze',     role: 'winter',     t0: 28.8, t1: 36.0 },
    { name: 'Rebirth',    role: 'monument',   t0: 36.0, t1: 43.2 },
    { name: 'Epilogue',   role: 'coda',       t0: 43.2, t1: 50.0 }
  ],
  narration: [
    { t0: 0.50, t1: 6.96, text: "Twelve thousand eight hundred years ago, Earth was thawing from the Ice Age. Suddenly, catastrophe struck." },
    { t0: 7.50, t1: 12.75, text: "A fragmented comet detonated above the northern ice sheets, igniting continent-spanning firestorms." },
    { t0: 14.70, t1: 20.77, text: "Beneath a dark geological layer of cosmic soot and nanodiamonds, North America's giant mammoths vanished forever." },
    { t0: 21.90, t1: 27.90, text: "Collapsing ice dams unleashed catastrophic megafloods into the oceans, shutting down global heat circulation." },
    { t0: 29.10, t1: 34.63, text: "The planet plunged into a twelve-hundred-year deep freeze, pushing surviving human tribes to the absolute brink." },
    { t0: 36.30, t1: 42.40, text: "When warmth abruptly returned, survivors gathered at Göbekli Tepe to carve the memory of the comet in megalithic stone." },
    { t0: 43.51, t1: 49.28, text: "Out of cosmic ashes and catastrophic ice, humanity pivoted to agriculture and the dawn of civilization." }
  ]
};
window.TIMELINE = TIMELINE;
